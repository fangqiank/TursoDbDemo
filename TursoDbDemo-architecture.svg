<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 836" font-family="ui-monospace,'Cascadia Code',Consolas,'SF Mono',Menlo,monospace">
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1060" height="836" fill="#0d0d0d"/>

  <!-- title -->
  <text x="40" y="36" font-size="20" font-weight="700" fill="#ececec">TursoDbDemo — Architecture</text>
  <text x="40" y="58" font-size="12" fill="#888">.NET 10 Minimal API · libSQL / Turso · 纯 ADO.NET · TUI Frontend</text>

  <!-- legend -->
  <g font-size="11" fill="#9a9a9a">
    <line x1="660" y1="33" x2="690" y2="33" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="696" y="37">运行时数据流 Runtime</text>
    <line x1="660" y1="51" x2="690" y2="51" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <text x="696" y="55">配置注入 Config</text>
    <line x1="860" y1="33" x2="890" y2="33" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="896" y="37">启动初始化 Startup</text>
  </g>

  <!-- ============ LAYER 1 : CLIENT ============ -->
  <rect x="40" y="78" width="980" height="104" rx="6" fill="#141414"/>
  <text x="52" y="98" font-size="11" font-weight="700" fill="#6b6b6b" letter-spacing="1.5">01 · CLIENT  客户端层</text>
  <rect x="80" y="110" width="900" height="62" rx="5" fill="#1c1c1c" stroke="#3a3a3a"/>
  <text x="94" y="132" font-size="14" font-weight="700" fill="#ececec">Browser 浏览器</text>
  <text x="94" y="152" font-size="12" fill="#b0b0b0">wwwroot/  →  index.html · css/tui.css · js/app.js · js/metadata.js     （AgomTUI 风格 TUI Dashboard）</text>
  <text x="966" y="152" font-size="11" fill="#4ade80" text-anchor="end">fetch('/api/products') · same-origin 同源</text>

  <line x1="530" y1="172" x2="530" y2="196" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ============ LAYER 2 : API HOST ============ -->
  <rect x="40" y="198" width="980" height="118" rx="6" fill="#141414"/>
  <text x="52" y="218" font-size="11" font-weight="700" fill="#6b6b6b" letter-spacing="1.5">02 · API HOST  接口宿主</text>
  <rect x="80" y="230" width="900" height="76" rx="5" fill="#1c1c1c" stroke="#3a3a3a"/>
  <text x="94" y="252" font-size="14" font-weight="700" fill="#ececec">ASP.NET Core 10 · Minimal API</text>
  <text x="966" y="252" font-size="11" fill="#777" text-anchor="end">(Program.cs)</text>
  <text x="94" y="274" font-size="12" fill="#b0b0b0">装配管道 Pipeline：</text>
  <g font-size="10.5" fill="#cfcfcf">
    <rect x="94"  y="284" width="214" height="16" rx="3" fill="#232323" stroke="#2f2f2f"/>
    <text x="101" y="296">UseDefaultFiles + UseStaticFiles</text>
    <rect x="316" y="284" width="186" height="16" rx="3" fill="#232323" stroke="#2f2f2f"/>
    <text x="323" y="296">UseExceptionHandler → 500</text>
    <rect x="510" y="284" width="186" height="16" rx="3" fill="#232323" stroke="#2f2f2f"/>
    <text x="517" y="296">(Dev) MapOpenApi + Scalar</text>
    <rect x="704" y="284" width="176" height="16" rx="3" fill="#232323" stroke="#2f2f2f"/>
    <text x="711" y="296">MapProductEndpoints</text>
  </g>

  <line x1="530" y1="316" x2="530" y2="340" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ============ LAYER 3 : ENDPOINTS ============ -->
  <rect x="40" y="342" width="980" height="92" rx="6" fill="#141414"/>
  <text x="52" y="362" font-size="11" font-weight="700" fill="#6b6b6b" letter-spacing="1.5">03 · ENDPOINTS  端点</text>
  <rect x="80" y="374" width="900" height="50" rx="5" fill="#1c1c1c" stroke="#3a3a3a"/>
  <text x="94" y="394" font-size="14" font-weight="700" fill="#ececec">ProductEndpoints  ·  /api/products</text>
  <text x="94" y="414" font-size="12" fill="#b0b0b0">GET /   ·   GET /{id:long}   ·   POST /   ·   PUT /{id:long}   ·   DELETE /{id:long}</text>
  <text x="966" y="414" font-size="11" fill="#fbbf24" text-anchor="end">DataAnnotations → 400（前端回显字段错误）</text>

  <line x1="530" y1="434" x2="530" y2="458" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ============ LAYER 4 : SERVICE ============ -->
  <rect x="40" y="460" width="980" height="86" rx="6" fill="#141414"/>
  <text x="52" y="480" font-size="11" font-weight="700" fill="#6b6b6b" letter-spacing="1.5">04 · SERVICE  业务服务</text>
  <rect x="80" y="492" width="900" height="46" rx="5" fill="#1c1c1c" stroke="#3a3a3a"/>
  <text x="94" y="512" font-size="14" font-weight="700" fill="#ececec">ProductService</text>
  <text x="212" y="512" font-size="11" fill="#777">(Scoped · 纯 ADO.NET · 非 Dapper)</text>
  <text x="94" y="530" font-size="11" fill="#888">价格以整数分存取（price_cents）；不使用 Dapper（Nelknet 要求参数名带 @ 前缀）</text>
  <text x="966" y="512" font-size="11" fill="#38bdf8" text-anchor="end">经 Factory.SerializationGate 序列化 · 事务 + 跟随 SELECT 释放写锁</text>

  <!-- ============ LAYER 5 : DATA ACCESS & STORE ============ -->
  <rect x="40" y="572" width="980" height="240" rx="6" fill="#141414"/>
  <text x="52" y="592" font-size="11" font-weight="700" fill="#6b6b6b" letter-spacing="1.5">05 · DATA ACCESS &amp; STORE  数据访问与存储</text>

  <!-- config source (left top) -->
  <rect x="80" y="596" width="290" height="44" rx="5" fill="#211c08" stroke="#5a4a14"/>
  <text x="94" y="615" font-size="13" font-weight="700" fill="#fbbf24">配置注入 Configuration</text>
  <text x="94" y="632" font-size="11" fill="#c9b26a">Dev: User Secrets  ·  Prod: 环境变量</text>

  <!-- options (left mid) -->
  <rect x="80" y="648" width="290" height="80" rx="5" fill="#1c1c1c" stroke="#3a3a3a"/>
  <text x="94" y="669" font-size="13" font-weight="700" fill="#ececec">TursoOptions</text>
  <text x="94" y="687" font-size="11" fill="#b0b0b0">· DataSource   (libSQL URL 或 app.db)</text>
  <text x="94" y="703" font-size="11" fill="#b0b0b0">· AuthToken?  (仅云端)</text>
  <text x="94" y="720" font-size="10.5" fill="#777">绑定 “Turso” 节 · appsettings 无凭据</text>

  <!-- factory (center, tall) -->
  <rect x="380" y="596" width="300" height="132" rx="5" fill="#1c1c1c" stroke="#3a3a3a"/>
  <text x="394" y="617" font-size="13" font-weight="700" fill="#ececec">LibSqlConnectionFactory</text>
  <text x="668" y="617" font-size="11" fill="#777" text-anchor="end">(Singleton)</text>
  <text x="394" y="638" font-size="11" fill="#b0b0b0">· 复用单一 LibSQLConnection</text>
  <text x="394" y="655" font-size="11" fill="#b0b0b0">· EnsureOpenAsync 幂等打开</text>
  <text x="394" y="672" font-size="11" fill="#b0b0b0">· SerializationGate 信号量</text>
  <text x="394" y="689" font-size="11" fill="#b0b0b0">   (序列化单连接访问)</text>
  <text x="394" y="706" font-size="11" fill="#b0b0b0">· BuildConnectionString：</text>
  <text x="394" y="721" font-size="11" fill="#b0b0b0">   Data Source[;Auth Token]</text>

  <!-- dbcommand extensions (right top) -->
  <rect x="690" y="596" width="300" height="44" rx="5" fill="#1c1c1c" stroke="#3a3a3a"/>
  <text x="704" y="615" font-size="13" font-weight="700" fill="#ececec">DbCommandExtensions</text>
  <text x="978" y="615" font-size="11" fill="#777" text-anchor="end">(internal)</text>
  <text x="704" y="632" font-size="11" fill="#b0b0b0">AddParam(@name, val) 链式 · Service/Initializer 共用</text>

  <!-- initializer (right mid) -->
  <rect x="690" y="648" width="300" height="80" rx="5" fill="#1c1c1c" stroke="#3a3a3a"/>
  <text x="704" y="669" font-size="13" font-weight="700" fill="#ececec">DatabaseInitializer</text>
  <text x="704" y="687" font-size="11" fill="#b0b0b0">· 启动：CREATE TABLE + 种子</text>
  <text x="704" y="703" font-size="11" fill="#b0b0b0">· schema 迁移：price → price_cents</text>
  <text x="704" y="719" font-size="10.5" fill="#777">   (检测旧列 · ROUND*100 · DROP)</text>

  <!-- db (bottom, wide) -->
  <rect x="80" y="740" width="910" height="58" rx="5" fill="#0f1f14" stroke="#2f5a3a"/>
  <text x="94" y="759" font-size="13" font-weight="700" fill="#4ade80">libSQL / Turso</text>
  <text x="94" y="777" font-size="11" fill="#9fd9b0">本地：app.db (libSQL 文件)     ·     云端：libsql://...turso.io (+Auth Token)</text>
  <text x="94" y="792" font-size="11" fill="#9fd9b0">列：id · name · description · price_cents (INTEGER，分) · stock · created_at · updated_at</text>

  <!-- config flow (amber) -->
  <line x1="225" y1="640" x2="225" y2="647" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="370" y1="688" x2="378" y2="688" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="376" y="682" font-size="10" fill="#fbbf24" text-anchor="end">reads</text>

  <!-- startup flow (cyan): initializer -> factory -->
  <line x1="690" y1="688" x2="682" y2="688" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="688" y="680" font-size="10" fill="#38bdf8" text-anchor="end">startup</text>

  <!-- data flow (green): factory -> db -->
  <line x1="530" y1="728" x2="530" y2="739" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- arrow 4 (Layer 4 Service → Layer 5 Factory): drawn LAST so the Layer 5 band cannot cover it -->
  <line x1="530" y1="540" x2="530" y2="592" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="538" y="568" font-size="11" fill="#4ade80">uses · ADO.NET</text>

  <!-- footer note -->
  <text x="40" y="826" font-size="10.5" fill="#666">时间戳 ISO-8601 文本 · 主键 INTEGER PRIMARY KEY AUTOINCREMENT (long) · 价格以整数分 (price_cents) 存储避免浮点精度 · 写操作事务 + 跟随 SELECT (last_insert_rowid / changes) 释放写锁</text>
</svg>
